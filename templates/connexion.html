<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Arctic</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/arctic-modern.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body style="background: linear-gradient(135deg, #F0FDFA 0%, #F9FAFB 100%); min-height: 100vh; display: flex; flex-direction: column;">

    <!-- Motifs discrets -->
    <div class="pattern-zen-rings" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 500px; height: 500px; opacity: 0.02; pointer-events: none; z-index: 0;"></div>

    <!-- Navigation fond sombre -->
    <header style="background: rgba(31, 41, 55, 0.95); backdrop-filter: blur(12px); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; max-width: 1400px; margin: 0 auto;">
            <a href="{{ url_for('accueil') }}" style="color: #FFFFFF; text-decoration: none; font-size: 1.5rem; font-weight: 700;">Arctic</a>
            <nav style="display: flex; gap: 2rem; align-items: center;">
                <a href="{{ url_for('accueil') }}" style="color: rgba(255, 255, 255, 0.85); text-decoration: none; font-weight: 500;">Accueil</a>
                <a href="{{ url_for('inscription') }}" style="color: rgba(255, 255, 255, 0.85); text-decoration: none; font-weight: 500;">Inscription</a>
            </nav>
        </div>
    </header>

    <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2.5rem 1.5rem; position: relative; z-index: 1;">
        
        <div class="card" style="width: 100%; max-width: 450px; padding: 2.5rem; position: relative; overflow: hidden;">
            
            <div class="pattern-zen-stones" style="position: absolute; top: -40px; right: -40px; width: 180px; height: 180px; opacity: 0.03;"></div>

            <div style="position: relative; z-index: 2;">
                <div style="text-align: center; margin-bottom: 2rem;">
                    <p style="font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.05em; color: #14B8A6; margin-bottom: 0.5rem; text-transform: uppercase;">CONNEXION</p>
                    <h1 style="font-size: 2rem; font-weight: 700; color: #1F2937; margin-bottom: 0.625rem;">Bon retour !</h1>
                    <p style="color: #6B7280; font-size: 0.9375rem;">Connectez-vous à votre espace Arctic</p>
                </div>

                <form method="POST" action="{{ url_for('connexion') }}" style="display: flex; flex-direction: column; gap: 1.25rem;">

                    <div>
                        <label for="email" class="label" style="display: block; font-weight: 600; color: #1F2937; margin-bottom: 0.5rem; font-size: 0.9375rem;">Adresse e-mail</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                            placeholder="votre@email.com"
                            class="input"
                            style="width: 100%; padding: 0.875rem 1.125rem; border: 2px solid #E5E5E5; border-radius: 10px; font-size: 0.9375rem; transition: all 0.3s;">
                    </div>

                    <div>
                        <label for="password" class="label" style="display: block; font-weight: 600; color: #1F2937; margin-bottom: 0.5rem; font-size: 0.9375rem;">Mot de passe</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            placeholder="••••••••"
                            class="input"
                            style="width: 100%; padding: 0.875rem 1.125rem; border: 2px solid #E5E5E5; border-radius: 10px; font-size: 0.9375rem; transition: all 0.3s;">
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.875rem; font-size: 1rem; font-weight: 600; margin-top: 0.5rem;">
                        Se connecter
                    </button>

                </form>

                <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.75rem; border-top: 1px solid #E5E5E5;">
                    <p style="color: #6B7280; font-size: 0.9375rem;">
                        Pas encore de compte ? 
                        <a href="{{ url_for('inscription') }}" style="color: #14B8A6; font-weight: 600; text-decoration: none;">S'inscrire</a>
                    </p>
                </div>
            </div>

        </div>

    </main>

    <footer style="background: #1F2937; color: rgba(255, 255, 255, 0.8); padding: 1.5rem; text-align: center;">
        <p style="margin: 0; font-size: 0.9375rem;">© 2026 Arctic — L'art mérite d'être découvert.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/arctic-ui.js') }}" defer></script>

</body>
</html>
